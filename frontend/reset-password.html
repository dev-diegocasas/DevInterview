<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Restablecer contraseña — DevInterview</title>
    <link rel="stylesheet" href="css/responsive.css"/>
    <link rel="stylesheet" href="css/components.css"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: '#5B7CFA', 'on-surface': '#E6E8EE', 'on-surface-variant': '#A7ADB8', 'surface-dim': '#0F1115', 'surface-container': '#171A21', 'surface-container-low': '#1A1E26', 'surface-container-high': '#20242D', 'surface-bright': '#2B313C', 'outline-variant': '#2B313C', error: '#D96B6B' } } }
        };
    </script>
</head>
<body class="bg-surface-dim min-h-screen flex items-center justify-center p-4" style="background-color:#0F1115;color:#E6E8EE;font-family:Geist,sans-serif">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="font-bold" style="color:#5B7CFA;font-size:28px">DevInterview</h1>
            <p class="mt-2" style="color:#A7ADB8;font-size:14px">Restablece tu contraseña</p>
        </div>

        <div id="reset-card" class="rounded-xl p-8 border" style="background-color:#171A21;border-color:#2B313C">
            <div id="reset-error" class="hidden mb-4 p-3 rounded-lg text-sm" style="background:rgba(217,107,107,0.1);border:1px solid rgba(217,107,107,0.3);color:#D96B6B"></div>
            <div id="reset-success" class="hidden mb-4 p-3 rounded-lg text-sm" style="background:rgba(76,175,122,0.1);border:1px solid rgba(76,175,122,0.3);color:#4CAF7A"></div>
            <div id="reset-loading" class="hidden mb-4 p-3 rounded-lg text-sm text-center" style="color:#A7ADB8">Validando token...</div>

            <form id="form-reset">
                <div class="mb-4">
                    <label class="block mb-2 text-sm" style="color:#A7ADB8" for="reset-new-password">Nueva contraseña</label>
                    <input id="reset-new-password" type="password" placeholder="Mínimo 6 caracteres" required minlength="6" class="w-full px-4 py-3 rounded-lg border text-sm outline-none transition-all" style="background-color:#1A1E26;border-color:#2B313C;color:#E6E8EE"/>
                </div>
                <button type="submit" id="reset-submit-btn" class="w-full py-3 rounded-lg font-semibold transition-all duration-150" style="background-color:#5B7CFA;color:#E6E8EE;font-size:15px">Restablecer contraseña</button>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="/login" class="text-sm" style="color:#5B7CFA;text-decoration:none">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var errorEl = document.getElementById('reset-error');
            var successEl = document.getElementById('reset-success');
            var loadingEl = document.getElementById('reset-loading');
            var form = document.getElementById('form-reset');
            var submitBtn = document.getElementById('reset-submit-btn');
            var passwordInput = document.getElementById('reset-new-password');

            if (!token) {
                errorEl.textContent = 'Token de recuperación no encontrado. Revisa el enlace de tu correo.';
                errorEl.classList.remove('hidden');
                form.classList.add('hidden');
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                errorEl.classList.add('hidden');
                successEl.classList.add('hidden');

                var newPassword = passwordInput.value.trim();
                if (newPassword.length < 6) {
                    errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Restableciendo...';

                try {
                    var response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, newPassword: newPassword })
                    });
                    var data = await response.json();
                    if (data.success) {
                        successEl.textContent = data.data.message || 'Contraseña restablecida correctamente. Puedes iniciar sesión.';
                        successEl.classList.remove('hidden');
                        form.classList.add('hidden');
                        setTimeout(function () {
                            window.location.href = '/login';
                        }, 3000);
                    } else {
                        errorEl.textContent = data.error || 'Error al restablecer la contraseña.';
                        errorEl.classList.remove('hidden');
                    }
                } catch (err) {
                    errorEl.textContent = 'Error de conexión. Intenta de nuevo.';
                    errorEl.classList.remove('hidden');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Restablecer contraseña';
                }
            });
        })();
    </script>
</body>
</html>
